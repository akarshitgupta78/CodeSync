services:
  # Database: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: codesync-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codesync}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Document Store: MongoDB (CRDT logs & snapshots)
  mongodb:
    image: mongo:7-jammy
    container_name: codesync-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infrastructure/init-scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # In-Memory Cache & Pub/Sub: Redis
  redis:
    image: redis:7-alpine
    container_name: codesync-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Core Backend (Authentication, Workspace Management, WebSockets/STOMP)
  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: codesync-backend-core
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codesync}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/codesync_docs
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Execution Engine (Sandboxed Code Execution)
  execution-engine:
    build:
      context: ./execution-engine
      dockerfile: Dockerfile
    container_name: codesync-execution-engine
    restart: always
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8081:8081"

  # Frontend (Vite React SPA + Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codesync-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-core
      - execution-engine

volumes:
  postgres_data:
  mongo_data:
  redis_data:

